<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project · Biz Data Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css?v=5aea0817">
<script data-goatcounter="https://biz-datalab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="index.html">Biz Data Lab</a>
    <div class="links">
      <a href="index.html#teaching">Experiential Learning</a>
      <a href="index.html#market-watch">Diamond Market Watch</a>
      <a href="index.html#ai-watch">AI Watch</a>
    </div>
  </div>
</nav>

<main id="page">
  <section class="band tint"><div class="wrap"><p class="loading">Loading…</p></div></section>
</main>

<footer><div class="wrap" id="foot">© Biz Data Lab</div></footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : (u && !/^[a-z]+:/i.test(u) ? u : "#");
const TYPE = { funded: "Funded research project", group: "Student group project", individual: "Individual research" };
const CAROUSEL = ["preparing for a classroom pilot", "emerging needs and opportunities", "long-term vision", "student voices"];
const HANDLED = ["links", "numbers", "student learning", "student work", "outcomes", "team", "partners", ...CAROUSEL];
const paras = sec => sec.items.map(i => `<p>${esc(i.join(" | "))}</p>`).join("");

function head(label, title, intro) {
  return `<div class="sec-head"><span class="label">${esc(label)}</span><h2>${esc(title)}</h2>${intro ? `<p>${esc(intro)}</p>` : ""}</div>`;
}
function band(inner, tint, id) { return `<section class="band${tint ? " tint" : ""}"${id ? ` id="${id}"` : ""}><div class="wrap">${inner}</div></section>`; }

function slideHTML(key, sec) {
  if (key === "long-term vision") {
    return `<h3>${esc(sec.name)}</h3>${sec.intro ? `<p class="slide-intro">${esc(sec.intro)}</p>` : ""}<div class="timeline">${sec.items.map(i => `<div><span class="yr">${esc(i[0])}</span><p>${esc(i[1] || "")}</p>${i[2] ? `<span class="jobs">${esc(i[2])}</span>` : ""}</div>`).join("")}</div>`;
  }
  if (key === "preparing for a classroom pilot") {
    return `<div class="pilot"><div><h3>${esc(sec.name)}</h3>${sec.intro ? `<p class="slide-intro">${esc(sec.intro)}</p>` : ""}<ol>${sec.items.map(i => { const t = i.join(" | "), c = t.indexOf(":"); return `<li>${c > 0 ? `<b>${esc(t.slice(0, c))}</b>${esc(t.slice(c))}` : esc(t)}</li>`; }).join("")}</ol></div>
      ${sec.photo ? `<figure><a href="${esc(sec.photo)}" target="_blank" rel="noopener"><img src="${esc(sec.photo)}" alt="Take It to Market poster" loading="lazy"></a>${sec.caption ? `<figcaption>${esc(sec.caption)} <a href="${esc(sec.photo)}" target="_blank" rel="noopener">View full size ↗</a></figcaption>` : ""}</figure>` : ""}</div>`;
  }
  if (key === "student voices") {
    return `<h3>Success stories: student voices</h3><div class="quotes">${sec.items.map(i => `<figure><blockquote>“${esc(i[0])}”</blockquote><figcaption><b>${esc(i[1] || "")}</b>${esc(i[2] || "")}</figcaption></figure>`).join("")}</div>`;
  }
  return `<h3>${esc(sec.name)}</h3><ul>${sec.items.map(i => `<li>${esc(i.join(" | "))}</li>`).join("")}</ul>`;
}

function render(p) {
  document.title = p.title + " · Biz Data Lab";
  const S = p.sections, out = [];
  const links = (S.links || {}).items || [];
  const facts = [["Period", p.period], ["Funding", p.funder], ["Status", p.status]].filter(f => f[1]);
  out.push(band(`<a class="back" href="index.html#teaching">← All projects</a>
    <div class="phero"><div>
      <span class="badge solid">${esc(TYPE[p.type] || "Project")}</span>
      <h1>${esc(p.title)}</h1>
      <div class="facts">${facts.map(f => `<span><b>${esc(f[0])}:</b> ${esc(f[1])}</span>`).join("")}</div>
      <p class="sum">${esc(p.summary || "")}</p>
      ${links.length ? `<div class="jump">${links.map(l => `<a class="btn" href="${esc(safeUrl(l[1]))}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div>` : ""}
    </div>${(p.hero || p.image) ? `<div class="phero-img${p.hero ? " photo" : ""}"><img src="${esc(p.hero || p.image)}" alt="${esc(p.title)}"></div>` : ""}</div>`, true));

  if (S.numbers) out.push(band(head("By the numbers", "Project at a glance", S.numbers.intro) +
    `<div class="stats">${S.numbers.items.map(n => `<div><b>${esc(n[0])}</b><span>${esc(n[1] || "")}</span></div>`).join("")}</div>`));

  if (S["student learning"]) {
    const L = S["student learning"];
    out.push(band(head("Experiential learning", "What students gained", L.intro) +
      `<div class="learn${L.items.length === 5 ? " five" : ""}">${L.items.map(i => `<div class="${/^AI\b/.test(i[0]) ? "tall" : ""}"><b>${esc(i[0])}</b><p>${esc(i.slice(1).join(" | "))}</p></div>`).join("")}</div>`, true));
  }

  if (S["student work"]) {
    const subs = S["student work"].subs.slice().sort((a, b) => ((b.images || []).length > 0) - ((a.images || []).length > 0));
    out.push(band(head("Student work", "What students built", "Highlights from the students' reports, tools, and deliverables.") +
      `<div class="work${p.layout === "charts" ? " charts" : ""}">${subs.map((w, idx) => `<article class="${(w.images || []).length ? "wide media" : (idx === subs.length - 1 && subs.filter(x => !(x.images || []).length).length % 2 ? "wide" : "")}">
        ${(w.images || []).length ? `<div class="imgs">${w.images.map(src => `<img src="${esc(src)}" alt="${esc(w.title)}" loading="lazy">`).join("")}</div>` : ""}
        <div class="wb"><h3>${esc(w.title)}</h3>${w.text ? `<p>${esc(w.text)}</p>` : ""}${w.bullets.length ? `<ul>${w.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        ${w.link ? `<a href="${esc(safeUrl(w.link))}" target="_blank" rel="noopener">See it live ↗</a>` : ""}</div></article>`).join("")}</div>`, true));
  }

  const slides = CAROUSEL.filter(k => S[k]);
  if (slides.length) out.push(band(head("Looking ahead", "Classroom pilot, opportunities, vision, and student voices") +
    `<div class="carousel" id="car"><div class="car-view"><div class="car-track" id="track">${slides.map((k, i) =>
      `<div class="car-slide" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${slides.length}">${slideHTML(k, S[k])}</div>`).join("")}</div></div>
      <div class="car-ctl"><div class="dots" id="dots">${slides.map((k, i) => `<button type="button" data-i="${i}">${esc(S[k].name)}</button>`).join("")}</div>
      <div class="arrows"><button type="button" id="prev" aria-label="Previous slide">←</button><button type="button" id="next" aria-label="Next slide">→</button></div></div></div>`));

  if (S.outcomes) out.push(band(head("Impact", "Outcomes beyond the plan") + `<div class="prose">${paras(S.outcomes)}</div>`, true));

  Object.keys(S).filter(k => !HANDLED.includes(k)).forEach(k => {
    const sec = S[k];
    const isProse = sec.items.length && sec.items.every(i => i.length === 1 && i[0].length > 80);
    out.push(band(head(k === "acknowledgments" ? "Thank you" : "Project", sec.name) + `<div class="generic">${sec.intro ? `<p>${esc(sec.intro)}</p>` : ""}${isProse ? `<div class="prose">${paras(sec)}</div>` : `<ul>${sec.items.map(i => `<li>${esc(i.join(" | "))}</li>`).join("")}</ul>`}
      ${sec.subs.map(sb => `<h3>${esc(sb.title)}</h3>${sb.text ? `<p>${esc(sb.text)}</p>` : ""}`).join("")}</div>`));
  });

  const tp = (S.team || {}).photo;
  if (S.team || S.partners) out.push(band(head("People", "Team and partners") +
    (tp ? `<figure class="team-photo"><img src="${esc(tp)}" alt="${esc(S.team.caption || "Project team")}" loading="lazy">${S.team.caption ? `<figcaption>${esc(S.team.caption)}</figcaption>` : ""}</figure>` : "") + `<div class="people">
    ${S.team ? `<div><h3>Team</h3><ul>${S.team.items.map(t => `<li><b>${esc(t[0])}</b><span>${esc(t[1] || "")}</span></li>`).join("")}</ul></div>` : ""}
    ${S.partners ? `<div><h3>Partners</h3><ul>${S.partners.items.map(t => `<li><b>${t[2] ? `<a href="${esc(safeUrl(t[2]))}" target="_blank" rel="noopener">${esc(t[0])}</a>` : esc(t[0])}</b><span>${esc(t[1] || "")}</span></li>`).join("")}</ul></div>` : ""}
  </div>`));

  $("page").innerHTML = out.join("");
  if (slides.length) carousel(slides.length);
}

function carousel(n) {
  let i = 0;
  const track = $("track"), dots = [...document.querySelectorAll("#dots button")], slides = [...track.children];
  const go = k => { i = (k + n) % n; track.style.transform = `translateX(${-100 * i}%)`;
    dots.forEach((d, j) => d.setAttribute("aria-current", j === i ? "true" : "false"));
    slides.forEach((s, j) => s.setAttribute("aria-hidden", j === i ? "false" : "true")); };
  $("prev").onclick = () => go(i - 1); $("next").onclick = () => go(i + 1);
  dots.forEach((d, j) => d.onclick = () => go(j));
  $("car").addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(i - 1); if (e.key === "ArrowRight") go(i + 1); });
  go(0);
}

const slug = new URLSearchParams(location.search).get("p");
fetch("data/site.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  const p = (d.projects || []).find(x => x.slug === slug) || (d.projects || [])[0];
  if (!p) { $("page").innerHTML = band('<p>Project not found. <a href="index.html#teaching">See all projects</a>.</p>'); return; }
  render(p);
}).catch(() => { $("page").innerHTML = band('<p>Could not load the project. Please refresh the page.</p>'); });
</script>
</body>
</html>
