name: Build site data

# Runs whenever anything is pushed to main (for example a new price CSV, a PDF,
# or an edit to a file in content/). It recalculates the price statistics and
# saves data/site.json. GitHub Pages then publishes the main branch directly
# (Settings → Pages → Source: "Deploy from a branch", main, / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculate prices and build site data
        run: python scripts/build.py
      - name: Save updated data files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html project.html
          git diff --cached --quiet || (git commit -m "Update site data" && git push)
      # Commits made by this workflow do not trigger a Pages build on their own,
      # so ask GitHub Pages to rebuild from main after saving.
      - name: Ask GitHub Pages to publish the latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request not accepted; the next push will publish."
